<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - TECH CARE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card form-container">
            <h3 class="card-title" style="text-align: center; font-size: 1.5rem; margin-bottom: 1.5rem;">CHANGE PASSWORD</h3>
            
            {% with messages = get_flashed_messages(category_filter=["error"]) %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('change_password_post') }}" method="POST">
                <div class="form-group">
                    <label class="form-label" for="old_password">Old Password</label>
                    <input class="form-control" type="password" id="old_password" name="old_password" placeholder="Old Password" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="new_password">New Password</label>
                    <input class="form-control" type="password" id="new_password" name="new_password" placeholder="New Password" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm Password</label>
                    <input class="form-control" type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
                </div>
                <button class="btn btn-primary btn-block" type="submit">Submit</button>
            </form>
            <div style="text-align: center; margin-top: 1rem;">
                <a href="javascript:history.back()" style="font-size: 0.9rem; color: var(--primary-color); text-decoration: none;">Back</a>
            </div>
        </div>
    </div>
</body>
</html>

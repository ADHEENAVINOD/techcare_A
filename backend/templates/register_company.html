<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Company Account - TECH CARE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card form-container" style="max-width: 600px;">
            <h2 class="card-title" style="text-align: center; font-size: 1.8rem; margin-bottom: 2rem;">CREATE ACCOUNT</h2>
            
            {% with messages = get_flashed_messages(category_filter=["error"]) %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('register_company_post') }}" method="POST">
                <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 0;">
                    <div class="form-group">
                        <label class="form-label" for="name">Company Name</label>
                        <input class="form-control" type="text" id="name" name="name" placeholder="Name" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" type="email" id="email" name="email" placeholder="Your Email" required>
                    </div>
                </div>

                <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 0;">
                    <div class="form-group">
                        <label class="form-label" for="phone">Contact No</label>
                        <input class="form-control" type="text" id="phone" name="phone" placeholder="Contact No" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="license">License</label>
                        <input class="form-control" type="text" id="license" name="license" placeholder="License No" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="house">House / Address Details</label>
                    <input class="form-control" type="text" id="house" name="house" placeholder="Address" required>
                </div>

                <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 0;">
                    <div class="form-group">
                        <label class="form-label" for="place">Place</label>
                        <input class="form-control" type="text" id="place" name="place" placeholder="Place" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="district">District</label>
                        <input class="form-control" type="text" id="district" name="district" placeholder="District" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="pin_code">Pin Code</label>
                        <input class="form-control" type="text" id="pin_code" name="pin_code" placeholder="Pin Code" required>
                    </div>
                </div>

                <div style="border-top: 1px solid var(--border-color); margin: 1.5rem 0; padding-top: 1.5rem;">
                    <h4 style="margin-bottom: 1rem; color: var(--primary-color);">Login Credentials</h4>
                    
                    <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 0;">
                        <div class="form-group">
                            <label class="form-label" for="username">Username</label>
                            <input class="form-control" type="text" id="username" name="username" placeholder="Choose Username" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" type="password" id="password" name="password" placeholder="Password" required>
                        </div>
                    </div>
                </div>

                <button class="btn btn-primary btn-block" type="submit">Sign Up</button>
            </form>
            
            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                <span style="color: var(--text-muted);">Already have an account?</span>
                <a href="{{ url_for('login') }}" style="color: var(--primary-color); font-weight: 600; text-decoration: none; margin-left: 0.5rem;">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
